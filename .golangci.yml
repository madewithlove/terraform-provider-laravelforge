# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - govet
  exclusions:
    # The *_resource_gen.go files carry the standard "// Code generated ... DO
    # NOT EDIT." header and are skipped; the hand-written *_resource.go CRUD in
    # the same packages is still linted.
    generated: lax

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
