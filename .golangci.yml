# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
issues:
  max-per-linter: 0
  max-same-issues: 0
  # The *_resource_gen.go files carry the standard "// Code generated ... DO NOT
  # EDIT." header and are skipped automatically (exclude-generated: lax). The
  # hand-written *_resource.go CRUD in the same packages is still linted.
  exclude-generated: lax

linters:
  disable-all: true
  enable:
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - gofmt
    - gosimple
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - govet
